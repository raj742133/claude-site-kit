<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
  :root { --w: 1600px; --h: 640px; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: var(--w); height: var(--h); overflow: hidden; font-family: Montserrat, system-ui, sans-serif; }
  body { position: relative; background:
    radial-gradient(55% 80% at 82% 20%, rgba(30,91,216,.20), transparent 70%),
    radial-gradient(40% 60% at 5% 90%, rgba(20,166,204,.18), transparent 70%), #f3f5fa; color: #0d1424; }
  .dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(13,20,36,.12) 1px, transparent 1.4px); background-size: 26px 26px; mask-image: linear-gradient(90deg, #000 0, transparent 70%); }
  .copy { position: absolute; left: 7%; top: 50%; transform: translateY(-50%); width: 44%; }
  .brand { display: flex; align-items: center; gap: 14px; font-weight: 800; font-size: 30px; letter-spacing: -.02em; }
  .brand svg { width: 46px; height: 46px; }
  h1 { font-size: calc(var(--h) * .088); line-height: 1.08; letter-spacing: -.03em; font-weight: 800; margin: 26px 0 18px; }
  h1 em { font-style: normal; color: #1e5bd8; }
  p { font-size: calc(var(--h) * .03); line-height: 1.55; color: #55607a; max-width: 88%; font-weight: 500; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
  .chips span { font: 500 calc(var(--h) * .024)/1 'JetBrains Mono', monospace; padding: 10px 16px; border-radius: 999px; background: #fff; border: 1px solid #dfe4ee; box-shadow: 0 8px 20px -12px rgba(30,91,216,.4); }
  .browser { position: absolute; background: #fff; border: 1px solid #dfe4ee; border-radius: 16px; overflow: hidden; box-shadow: 0 40px 80px -30px rgba(30,91,216,.5); }
  .bar { display: flex; gap: 7px; padding: 12px 16px; background: #f8f9fc; border-bottom: 1px solid #dfe4ee; }
  .bar i { width: 11px; height: 11px; border-radius: 50%; background: #c9d1e0; }
  .browser img { display: block; width: 100%; aspect-ratio: 1440/900; object-fit: cover; object-position: top; }
  .b1 { left: 57%; top: 10%; width: 40%; transform: rotate(-2deg); }
  .b2 { left: 68%; top: 54%; width: 29%; transform: rotate(2deg); z-index: 2; }
  .phone { position: absolute; left: 54%; top: 40%; width: 12%; background: #0d1424; border-radius: 30px; padding: 8px; box-shadow: 0 40px 70px -24px rgba(13,20,36,.6); z-index: 3; transform: rotate(-4deg); }
  .phone img { display: block; width: 100%; border-radius: 23px; aspect-ratio: 390/844; object-fit: cover; object-position: top; }
  body.og h1 { font-size: 64px; } body.og p { font-size: 22px; } body.og .chips span { font-size: 15px; padding: 8px 13px; }
</style></head>
<body>
  <div class="dots"></div>
  <div class="copy">
    <div class="brand"><svg viewBox="0 0 48 48"><path d="M24 5.5 L40 14.75 V33.25 L24 42.5 L8 33.25 V14.75 Z" fill="none" stroke="#1e5bd8" stroke-width="5" stroke-linejoin="round"/><circle cx="24" cy="24" r="6.5" fill="#14a6cc"/></svg>site-kit</div>
    <h1>Your brand in. A <em>working website</em> out.</h1>
    <p>A Claude Code skill that generates landing page, sign-in, MFA, dashboard, publishing and connect-a-phone, then tests it in a real browser.</p>
    <div class="chips"><span>landing</span><span>sign-in</span><span>mfa</span><span>dashboard</span><span>publishing</span><span>connect</span></div>
  </div>
  <div class="browser b1"><div class="bar"><i></i><i></i><i></i></div><img src="../site/assets/shots/coffee/landing-hero.jpg"></div>
  <div class="browser b2"><div class="bar"><i></i><i></i><i></i></div><img src="../site/assets/shots/coffee/dashboard.jpg"></div>
  <div class="phone"><img src="../site/assets/shots/coffee/landing-mobile.jpg"></div>
  <script>if (location.hash === '#og') document.body.classList.add('og');</script>
</body></html>
